<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 04 Menu</title>
  <style>
    :root {
      --bg: #f4fbff;
      --surface: #ffffff;
      --text: #16324f;
      --muted: #556a84;
      --accent: #5da8f6;
      --accent-dark: #1f4f83;
      --border: #dbe8f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sarabun", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #ecf7ff 0%, #dceeff 40%, #c3defd 100%);
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 30px 20px 40px;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 18px 36px rgba(22, 50, 79, 0.08);
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 110px;
      padding: 18px;
      text-decoration: none;
      color: var(--accent-dark);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(93, 168, 246, 0.18);
      border-color: rgba(93, 168, 246, 0.35);
      color: #11355c;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
    }

    .footer a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Lab 04</h1>
      <p>แบบฝึกหัดที่ 4 2D Platform Game</p>
    </header>

    <section class="buttons">
      <a class="button" href="index.html">เล่น Lab 04</a>
      <a class="button" href="../index.html">กลับไปยังหน้า Labs</a>
    </section>

  </div>
</body>
</html>
