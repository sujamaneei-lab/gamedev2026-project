<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 02 - Subpage 2</title>
  <style>
    :root {
      --bg: #f8fbff;
      --surface: #ffffff;
      --text: #16324f;
      --muted: #5c728d;
      --accent: #5da8f6;
      --border: #dfe8f4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sarabun", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f7fcff 0%, #e6eefb 100%);
    }

    .page {
      max-width: 840px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    header {
      margin-bottom: 26px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }

    .link-back {
      display: inline-block;
      padding: 12px 18px;
      background: var(--surface);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .link-back:hover {
      background: #f0f8ff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Lab 02 - Subpage 2</h1>
      <p>นี่คือหน้า Subpage 2 สำหรับ Lab 2. ใช้หน้านี้เพื่อแยกเนื้อหาเพิ่มเติมหรือฟีเจอร์เฉพาะ.</p>
    </header>

    <p>คุณสามารถปรับแต่งหน้านี้ให้เป็นหน้าเกมย่อย หรือหน้าตัวเลือกสำหรับ Lab 2 ได้ตามต้องการ.</p>

    <a class="link-back" href="index.html">กลับไปยัง Lab 02</a>
  </div>
</body>
</html>
